:root{--pink:#EE137B;--navy:#181949;--navy2:#24266b}
*{box-sizing:border-box;margin:0}

.card{width:91mm;height:55mm;position:relative;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.2);page-break-after:always}
.front{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:7mm}

.logo{display:flex;align-items:center;gap:2.4mm;position:relative;z-index:1}
.logo svg{width:9mm;height:9mm}

.name{position:absolute;left:7mm;bottom:9mm;z-index:1}
.name h1{font-size:5.6mm;font-weight:800}.name p{font-size:2.9mm;color:#c9c9e6;margin-top:1mm}
.contact{position:absolute;left:7mm;bottom:7mm;font-size:2.5mm;line-height:1.55;color:#e8e8f6;z-index:1}
.back{background:#fff;color:var(--navy);display:flex;align-items:center;gap:5mm;padding:7mm 5mm 7mm 8mm}
.back:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3mm;background:var(--pink)}
.qr{width:31mm;height:31mm;flex:none;margin-left:1mm}
.qr svg{width:100%;height:100%;display:block}
.txt{white-space:nowrap}.txt h2{font-size:4.2mm;font-weight:800;line-height:1.25}.txt h2 b{color:var(--pink)}
.txt p{font-size:2.7mm;color:#555570;margin-top:2mm;line-height:1.5}
.txt .url{font-family:Consolas,monospace;font-size:2.5mm;color:var(--navy);margin-top:3mm;font-weight:700}
.txt .note{position:absolute;left:12mm;bottom:3.5mm;font-size:1.9mm;color:#8a8aa0}
@media print{body{background:none;padding:0;gap:0;display:block}.card{box-shadow:none}}
